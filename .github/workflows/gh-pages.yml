name: github pages

on:
  push:
    branches:
      - main  # Set a branch that will trigger a deployment
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MkDocs dependencies
        run: |
          for sem in 1 2 3; do
            pip install -r programming-python-${sem}sem/requirements.txt
          done

      - name: Build MkDocs sites
        run: |
          for sem in 1 2 3; do
            (cd programming-python-${sem}sem && mkdocs build)
          done

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.154.5'
          # extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Copy MkDocs sites to Hugo public directory
        run: |
          for sem in 1 2 3; do
            mkdir -p ./public/ua/courses/programming-${sem}sem
            cp -r programming-python-${sem}sem/site/* ./public/ua/courses/programming-${sem}sem/
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
